<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:'DM Sans';src:url('/assets/fonts/dm-sans-var-latin.woff2') format('woff2');font-weight:300 700;}
html,body{margin:0;padding:0;background:#F7F7F5;}
svg{display:block;font-family:'DM Sans',sans-serif;}
text{fill:#0E0E0D;}
</style></head><body>
<svg id="c" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
  </defs>
  <rect width="1600" height="900" fill="#F7F7F5"/>
  <g id="palco"></g>
  <g id="chrome"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const FUNDO='#F7F7F5', CLARO='#0E0E0D', ACENTO='#C7C5BF';
/* as cores do sistema, na ordem em que entram no filme */
const LARANJA='#FF8A00', CORAL='#FF5A3C', ROSA='#FF2D6F', ROXO='#9B5DF5', AZUL='#4D7CFF';
const el=(tag,attrs={},pai=null)=>{const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]); (pai||document.getElementById('palco')).appendChild(n); return n;};
const txt=(s,attrs={},pai=null)=>{const n=el('text',attrs,pai); n.textContent=s; return n;};

/* ---------- tempo e suavização ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eOut4=x=>1-Math.pow(1-x,4);
const eIn=x=>x*x*x;
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
/* aparece e some: 1 dentro da janela, 0 fora */
const janela=(t,a,b,fi=.45,fo=.45)=>Math.min(p(t,a,a+fi), 1-p(t,b-fo,b));

/* ---------- roteiro ---------- */
const ATOS=[
  {a:0.2,  b:5.4,  n:'01', tit:'Contato'},
  {a:5.4,  b:11.2, n:'02', tit:'Conversa assíncrona'},
  {a:11.2, b:16.4, n:'03', tit:'Briefing'},
  {a:16.4, b:22.0, n:'04', tit:'Cronograma'},
  {a:22.0, b:26.8, n:'05', tit:'Entregas'}
];
const FIM=27.4;

const chrome=document.getElementById('chrome');

/* ================= ATO 1 · CONTATO ================= */
const g1=el('g',{opacity:0});
const cxA=440, cxB=1040, cy=270, L=120;
const q1a=el('rect',{x:cxA,y:cy,width:L,height:L,fill:'none',stroke:CLARO,'stroke-width':2},g1);
const l1=[]; for(let i=0;i<3;i++) l1.push(el('rect',{x:cxA+22,y:cy+30+i*24,width:0,height:6,fill:ACENTO},g1));
const q1b=el('rect',{x:cxB,y:cy,width:L,height:L,fill:'none',stroke:CLARO,'stroke-width':2},g1);
const q1bF=el('rect',{x:cxB,y:cy,width:L,height:L,fill:ROSA,opacity:0},g1);
const trilhoA=el('line',{x1:cxA+L+34,y1:cy+L/2,x2:cxA+L+34,y2:cy+L/2,stroke:CLARO,'stroke-opacity':.28,'stroke-dasharray':'6 8'},g1);
const bala=el('rect',{x:0,y:0,width:26,height:26,fill:ROSA,opacity:0},g1);
txt('VOCÊ',    {x:cxA,y:cy+L+34,'font-size':14,'font-weight':600,'letter-spacing':2.8,'fill-opacity':.55},g1);
txt('ESTÚDIO', {x:cxB,y:cy+L+34,'font-size':14,'font-weight':600,'letter-spacing':2.8,'fill-opacity':.55},g1);

/* ================= ATO 2 · CONVERSA ================= */
const g2=el('g',{opacity:0});
const espinha=el('line',{x1:800,y1:210,x2:800,y2:210,stroke:CLARO,'stroke-opacity':.28},g2);
const MSGS=[
  {lado:-1,w:230,y:236,h:'ter 14:20',q:0.06},
  {lado: 1,w:270,y:296,h:'ter 16:05',q:0.20},
  {lado: 1,w:190,y:356,h:'qua 09:12',q:0.40},
  {lado:-1,w:310,y:416,h:'qua 18:40',q:0.62},
  {lado: 1,w:215,y:476,h:'qui 10:15',q:0.82}
];
const msgN=MSGS.map(m=>{
  const x = m.lado<0 ? 800-28-m.w : 800+28;
  const r = el('rect',{x,y:m.y,width:m.w,height:30,fill:ACENTO,opacity:0},g2);
  const a = m.lado<0
    ? txt(m.h,{x:800-28-m.w-16,y:m.y+21,'font-size':14,'font-weight':600,'letter-spacing':1.6,'text-anchor':'end','fill-opacity':.5,opacity:0},g2)
    : txt(m.h,{x:800+28+m.w+16,y:m.y+21,'font-size':14,'font-weight':600,'letter-spacing':1.6,'fill-opacity':.5,opacity:0},g2);
  return {r,a,x,...m};
});

/* ================= ATO 3 · BRIEFING ================= */
const g3=el('g',{opacity:0});
const DX=600, DY=196, DW=400, DH=372;
const doc=el('rect',{x:DX,y:DY,width:DW,height:DH,fill:'none',stroke:CLARO,'stroke-width':2},g3);
const docTit=el('rect',{x:DX+34,y:DY+40,width:0,height:14,fill:CLARO},g3);
const docL=[]; for(let i=0;i<6;i++) docL.push(el('rect',{x:DX+34,y:DY+92+i*30,width:0,height:8,fill:ACENTO},g3));
const selo=el('rect',{x:DX+34,y:DY+296,width:34,height:34,fill:'none',stroke:CLARO,'stroke-width':2,opacity:0},g3);
const seloC=el('path',{d:`M${DX+42} ${DY+313} l7 8 13 -16`,fill:'none',stroke:ROXO,'stroke-width':3,opacity:0},g3);
txt('ESCOPO · METAS · LIMITES',{x:DX+84,y:DY+319,'font-size':14,'font-weight':600,'letter-spacing':2.2,'fill-opacity':.6},g3);

/* ================= ATO 4 · CRONOGRAMA ================= */
const g4=el('g',{opacity:0});
const GX=330, GW=940, COL=GW/8, GY=232;
const colL=[]; for(let i=0;i<=8;i++) colL.push(el('line',{x1:GX+i*COL,y1:GY-16,x2:GX+i*COL,y2:GY+300,stroke:CLARO,'stroke-opacity':.13},g4));
const BARRAS=[{s:0,n:2,y:0,t:'Descoberta'},{s:2,n:2,y:1,t:'Direção'},{s:3,n:4,y:2,t:'Design'},{s:6,n:2,y:3,t:'Entrega'}];
const barN=BARRAS.map(b=>{
  const r=el('rect',{x:GX+b.s*COL+5,y:GY+b.y*56,width:0,height:34,fill:[LARANJA,CORAL,ROSA,ROXO][b.y]},g4);
  const a=txt(b.t,{x:GX+b.s*COL+5,y:GY+b.y*56-9,'font-size':14.5,'font-weight':600,'letter-spacing':1.4,'fill-opacity':.65,opacity:0},g4);
  return {r,a,w:b.n*COL-10};
});
const baseL=el('line',{x1:GX,y1:GY+272,x2:GX,y2:GY+272,stroke:CLARO,'stroke-opacity':.4},g4);
const marcos=[2,4,6,8].map(c=>el('rect',{x:GX+c*COL-7,y:GY+265,width:14,height:14,fill:AZUL,opacity:0},g4));
for(let i=0;i<8;i++) txt('S'+(i+1),{x:GX+i*COL+8,y:GY+310,'font-size':13.5,'font-weight':600,'letter-spacing':1.6,'fill-opacity':.45},g4);

/* ================= ATO 5 · ENTREGAS ================= */
const g5=el('g',{opacity:0});
const bloco=el('rect',{x:720,y:232,width:160,height:160,fill:CLARO},g5);
const ENT=['Manual','Arquivos','Templates'];
const entN=ENT.map((nome,i)=>{
  const xf=448+i*272;
  const r=el('rect',{x:720,y:232,width:160,height:160,fill:'none',stroke:CLARO,'stroke-width':2,opacity:0},g5);
  const a=txt(nome,{x:xf+80,y:460,'font-size':18,'font-weight':600,'text-anchor':'middle',opacity:0},g5);
  return {r,a,xf};
});

/* ================= RENDER ================= */
function render(t){
  let ativo=-1;
  ATOS.forEach((A,i)=>{ if(t>=A.a && t<A.b) ativo=i; });

  /* ---- ato 1 ---- */
  const A1=ATOS[0], v1=janela(t,A1.a,A1.b,.4,.4);
  g1.setAttribute('opacity',v1.toFixed(3));
  q1a.setAttribute('opacity',eOut(p(t,A1.a+.1,A1.a+.7)));
  l1.forEach((r,i)=>r.setAttribute('width',(66*eOut(p(t,A1.a+.4+i*.13,A1.a+.9+i*.13))).toFixed(1)));
  trilhoA.setAttribute('x2',(lerp(cxA+L+34,cxB-34,eOut(p(t,A1.a+1.1,A1.a+2.0)))).toFixed(1));
  q1b.setAttribute('opacity',eOut(p(t,A1.a+1.5,A1.a+2.1)));
  const vb=p(t,A1.a+1.9,A1.a+3.4);
  bala.setAttribute('opacity', vb>0 && vb<1 ? 1 : 0);
  bala.setAttribute('x',(lerp(cxA+L+18,cxB+L/2-13,eInOut(vb))).toFixed(1));
  bala.setAttribute('y',(cy+L/2-13).toFixed(1));
  q1bF.setAttribute('opacity',eOut(p(t,A1.a+3.3,A1.a+3.8)).toFixed(3));

  /* ---- ato 2 ---- */
  const A2=ATOS[1], v2=janela(t,A2.a,A2.b,.4,.4);
  g2.setAttribute('opacity',v2.toFixed(3));
  espinha.setAttribute('y2',(lerp(210,530,eOut(p(t,A2.a+.1,A2.a+1.0)))).toFixed(1));
  msgN.forEach(m=>{
    const t0=A2.a+.6+m.q*3.6, pr=eOut4(p(t,t0,t0+.42));
    m.r.setAttribute('opacity',pr.toFixed(3));
    m.r.setAttribute('width',(m.w*pr).toFixed(1));
    if(m.lado<0) m.r.setAttribute('x',(800-28-m.w*pr).toFixed(1));
    m.a.setAttribute('opacity',(eOut(p(t,t0+.25,t0+.7))*.9).toFixed(3));
  });

  /* ---- ato 3 ---- */
  const A3=ATOS[2], v3=janela(t,A3.a,A3.b,.4,.4);
  g3.setAttribute('opacity',v3.toFixed(3));
  doc.setAttribute('opacity',eOut(p(t,A3.a+.1,A3.a+.8)));
  doc.setAttribute('height',(DH*eOut(p(t,A3.a+.1,A3.a+.9))).toFixed(1));
  docTit.setAttribute('width',(210*eOut(p(t,A3.a+.7,A3.a+1.2))).toFixed(1));
  docL.forEach((r,i)=>{
    const t0=A3.a+1.0+i*.19;
    r.setAttribute('width',((i%2?268:332)*eOut(p(t,t0,t0+.4))).toFixed(1));
  });
  selo.setAttribute('opacity',eOut(p(t,A3.a+2.6,A3.a+3.0)));
  seloC.setAttribute('opacity',eOut(p(t,A3.a+2.9,A3.a+3.3)));

  /* ---- ato 4 ---- */
  const A4=ATOS[3], v4=janela(t,A4.a,A4.b,.4,.4);
  g4.setAttribute('opacity',v4.toFixed(3));
  colL.forEach((l,i)=>l.setAttribute('opacity',eOut(p(t,A4.a+.1+i*.035,A4.a+.5+i*.035))));
  barN.forEach((b,i)=>{
    const t0=A4.a+.7+i*.42;
    b.r.setAttribute('width',(b.w*eOut(p(t,t0,t0+.65))).toFixed(1));
    b.a.setAttribute('opacity',eOut(p(t,t0+.15,t0+.6)).toFixed(3));
  });
  baseL.setAttribute('x2',(lerp(GX,GX+GW,eOut(p(t,A4.a+2.4,A4.a+3.2)))).toFixed(1));
  marcos.forEach((m,i)=>{
    const t0=A4.a+2.8+i*.22, pr=eOut4(p(t,t0,t0+.4));
    m.setAttribute('opacity',pr.toFixed(3));
    m.setAttribute('y',(GY+265-26*(1-pr)).toFixed(1));
  });

  /* ---- ato 5 ---- */
  const A5=ATOS[4], v5=janela(t,A5.a,A5.b,.4,.4);
  g5.setAttribute('opacity',v5.toFixed(3));
  bloco.setAttribute('opacity',(eOut(p(t,A5.a+.1,A5.a+.7))*(1-p(t,A5.a+1.3,A5.a+1.7))).toFixed(3));
  entN.forEach((e,i)=>{
    const t0=A5.a+1.3+i*.16, pr=eInOut(p(t,t0,t0+.95));
    e.r.setAttribute('opacity',eOut(p(t,t0,t0+.35)).toFixed(3));
    e.r.setAttribute('x',(lerp(720,e.xf,pr)).toFixed(1));
    e.a.setAttribute('opacity',eOut(p(t,t0+.5,t0+.95)).toFixed(3));
  });

}
/* cada ato é medido quando já está montado e então centralizado no quadro */
const MEDIR=[4.6, 10.4, 15.6, 21.2, 26.0];
const CAIXA_W=1230, CAIXA_H=610, CX=800, CY=450;
[g1,g2,g3,g4,g5].forEach((g,i)=>{
  g.removeAttribute('transform');
  render(MEDIR[i]);
  const b=g.getBBox();
  const s=Math.min(1.55, CAIXA_W/b.width, CAIXA_H/b.height);
  g.setAttribute('transform',
    'translate('+(CX-(b.x+b.width/2)*s).toFixed(2)+' '+(CY-(b.y+b.height/2)*s).toFixed(2)+') scale('+s.toFixed(4)+')');
});

window.render=render; window.DUR=FIM; window.DUR_REAL=20; window.ESCALA=FIM/20;
render(0);
</script></body></html>
