<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:'DM Sans';src:url('/assets/fonts/dm-sans-var-latin.woff2') format('woff2');font-weight:300 700;}
html,body{margin:0;padding:0;background:#F7F7F5;}
svg{display:block;font-family:'DM Sans',sans-serif;}
text{fill:#0E0E0D;}
</style></head><body>
<svg id="c" width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- a mesma malha dos blocos de mídia do site, para o filme ser do
         mesmo material que as capas -->
    <linearGradient id="malha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A00"/><stop offset=".42" stop-color="#FF1F4B"/>
      <stop offset=".68" stop-color="#FF5EA8"/><stop offset="1" stop-color="#CBB6FF"/>
    </linearGradient>
    <radialGradient id="m1" cx=".08" cy=".04" r=".75">
      <stop offset="0" stop-color="#FFB100"/><stop offset="1" stop-color="#FFB100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m2" cx=".92" cy=".96" r=".64">
      <stop offset="0" stop-color="#EFE2FF"/><stop offset="1" stop-color="#EFE2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#F7F7F5"/>
  <g id="palco"></g>
  <g id="chrome"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
const FUNDO='#F7F7F5', TINTA='#0E0E0D', CINZA='#C7C5BF';
/* as sete cores do sistema, na ordem em que entram no filme */
const LARANJA='#FF8A00', CORAL='#FF5A3C', ROSA='#FF2D6F', ROXO='#9B5DF5', AZUL='#4D7CFF';

const el=(tag,attrs={},pai=null)=>{const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]); (pai||document.getElementById('palco')).appendChild(n); return n;};
const txt=(s,attrs={},pai=null)=>{const n=el('text',attrs,pai); n.textContent=s; return n;};
/* um quadrado com a malha é três retângulos empilhados, como no SVG das capas */
const malha=(a,pai)=>{const g=el('g',{},pai);
  ['url(#malha)','url(#m1)','url(#m2)'].forEach(f=>el('rect',Object.assign({},a,{fill:f}),g));
  return g;};

/* ---------- tempo e suavização ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eOut4=x=>1-Math.pow(1-x,4);
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,x)=>a+(b-a)*x;
/* aparece e some: 1 dentro da janela, 0 fora */
const janela=(t,a,b,fi=.45,fo=.45)=>Math.min(p(t,a,a+fi), 1-p(t,b-fo,b));

/* ---------- roteiro ---------- */
const ATOS=[
  {a:0.2,  b:5.4,  n:'01', tit:'Contato'},
  {a:5.4,  b:11.2, n:'02', tit:'Conversa assíncrona'},
  {a:11.2, b:16.4, n:'03', tit:'Briefing'},
  {a:16.4, b:22.0, n:'04', tit:'Cronograma'},
  {a:22.0, b:26.8, n:'05', tit:'Entregas'}
];
const FIM=27.4;

/* ================= ATO 1 · CONTATO ================= */
/* dois quadrados e um bloco que atravessa: quando ele chega, o quadrado
   do estúdio deixa de ser contorno e vira a malha                        */
const g1=el('g',{opacity:0});
const L=170, cxA=380, cxB=1050, cy=250;
const q1a=el('rect',{x:cxA,y:cy,width:L,height:L,fill:'none',stroke:TINTA,'stroke-width':2},g1);
const l1=[]; for(let i=0;i<3;i++) l1.push(el('rect',{x:cxA+30,y:cy+46+i*30,width:0,height:9,fill:CINZA},g1));
const trilhoA=el('line',{x1:cxA+L+40,y1:cy+L/2,x2:cxA+L+40,y2:cy+L/2,stroke:TINTA,'stroke-opacity':.22,'stroke-width':2,'stroke-dasharray':'2 10','stroke-linecap':'round'},g1);
const q1bM=malha({x:cxB,y:cy,width:L,height:L},g1); q1bM.setAttribute('opacity',0);
const q1b=el('rect',{x:cxB,y:cy,width:L,height:L,fill:'none',stroke:TINTA,'stroke-width':2},g1);
const bala=el('rect',{x:0,y:0,width:34,height:34,fill:ROSA,opacity:0},g1);
txt('VOCÊ',    {x:cxA,y:cy+L+44,'font-size':15,'font-weight':600,'letter-spacing':3,'fill-opacity':.5},g1);
txt('ESTÚDIO', {x:cxB,y:cy+L+44,'font-size':15,'font-weight':600,'letter-spacing':3,'fill-opacity':.5},g1);

/* ================= ATO 2 · CONVERSA ================= */
/* barras cheias em vez de contorno: as suas em preto, as do estúdio em cor */
const g2=el('g',{opacity:0});
const espinha=el('line',{x1:800,y1:190,x2:800,y2:190,stroke:TINTA,'stroke-opacity':.14,'stroke-width':2},g2);
const MSGS=[
  {lado:-1,w:250,y:212,h:'ter 14:20',q:0.06,c:TINTA},
  {lado: 1,w:290,y:284,h:'ter 16:05',q:0.20,c:LARANJA},
  {lado:-1,w:200,y:356,h:'qua 09:12',q:0.40,c:TINTA},
  {lado: 1,w:330,y:428,h:'qua 18:40',q:0.62,c:ROSA},
  {lado: 1,w:235,y:500,h:'qui 10:15',q:0.82,c:ROXO}
];
const msgN=MSGS.map(m=>{
  const x = m.lado<0 ? 800-32-m.w : 800+32;
  const r = el('rect',{x,y:m.y,width:m.w,height:42,fill:m.c,opacity:0},g2);
  const a = m.lado<0
    ? txt(m.h,{x:800-32-m.w-18,y:m.y+28,'font-size':15,'font-weight':600,'letter-spacing':1.6,'text-anchor':'end','fill-opacity':.45,opacity:0},g2)
    : txt(m.h,{x:800+32+m.w+18,y:m.y+28,'font-size':15,'font-weight':600,'letter-spacing':1.6,'fill-opacity':.45,opacity:0},g2);
  return {r,a,x,...m};
});

/* ================= ATO 3 · BRIEFING ================= */
const g3=el('g',{opacity:0});
const DX=580, DY=170, DW=440, DH=410;
const doc=el('rect',{x:DX,y:DY,width:DW,height:DH,fill:'#FFFFFF',stroke:TINTA,'stroke-width':2},g3);
const docTit=el('rect',{x:DX+38,y:DY+44,width:0,height:20,fill:TINTA},g3);
const docL=[]; for(let i=0;i<6;i++) docL.push(el('rect',{x:DX+38,y:DY+104+i*32,width:0,height:10,fill:CINZA},g3));
/* o aceite: um quadrado cheio de cor com o visto em branco por cima */
const selo=el('rect',{x:DX+38,y:DY+318,width:44,height:44,fill:ROXO,opacity:0},g3);
const seloC=el('path',{d:`M${DX+50} ${DY+341} l9 10 16 -20`,fill:'none',stroke:'#FFFFFF','stroke-width':4,'stroke-linecap':'square',opacity:0},g3);
txt('ESCOPO · METAS · LIMITES',{x:DX+100,y:DY+347,'font-size':15,'font-weight':600,'letter-spacing':2.2,'fill-opacity':.55},g3);

/* ================= ATO 4 · CRONOGRAMA ================= */
const g4=el('g',{opacity:0});
const GX=300, GW=1000, COL=GW/8, GY=210;
const colL=[]; for(let i=0;i<=8;i++) colL.push(el('line',{x1:GX+i*COL,y1:GY-24,x2:GX+i*COL,y2:GY+372,stroke:TINTA,'stroke-opacity':.10,'stroke-width':2},g4));
const BARRAS=[{s:0,n:2,y:0,t:'Descoberta',c:LARANJA},{s:2,n:2,y:1,t:'Direção',c:CORAL},
              {s:3,n:4,y:2,t:'Design',c:ROSA},{s:6,n:2,y:3,t:'Entrega',c:ROXO}];
const barN=BARRAS.map(b=>{
  const r=el('rect',{x:GX+b.s*COL+6,y:GY+b.y*74,width:0,height:42,fill:b.c},g4);
  const a=txt(b.t,{x:GX+b.s*COL+6,y:GY+b.y*74-14,'font-size':16,'font-weight':600,'letter-spacing':1.2,'fill-opacity':.7,opacity:0},g4);
  return {r,a,w:b.n*COL-12};
});
const baseL=el('line',{x1:GX,y1:GY+342,x2:GX,y2:GY+342,stroke:TINTA,'stroke-opacity':.35,'stroke-width':2},g4);
const marcos=[2,4,6,8].map(c=>el('rect',{x:GX+c*COL-9,y:GY+333,width:18,height:18,fill:AZUL,opacity:0},g4));
for(let i=0;i<8;i++) txt('S'+(i+1),{x:GX+i*COL+10,y:GY+387,'font-size':14,'font-weight':600,'letter-spacing':1.6,'fill-opacity':.4},g4);

/* ================= ATO 5 · ENTREGAS ================= */
/* o bloco de malha se parte em três peças: o material do estúdio virando
   entrega. As peças não são mais malha, senão viram três cópias da mesma
   textura em vez de três coisas diferentes                                */
const g5=el('g',{opacity:0});
const EW=190, EY=250, EX0=800-EW/2;
const blocoM=malha({x:EX0,y:EY,width:EW,height:EW},g5); blocoM.setAttribute('opacity',0);
const ENT=[{n:'Manual',c:LARANJA},{n:'Arquivos',c:ROSA},{n:'Templates',c:ROXO}];
const entN=ENT.map((e,i)=>{
  const xf=420+i*300;
  const g=el('g',{opacity:0},g5);
  el('rect',{x:EX0,y:EY,width:EW,height:EW,fill:'#FFFFFF',stroke:TINTA,'stroke-width':2},g);
  el('rect',{x:EX0,y:EY,width:EW,height:14,fill:e.c},g);
  const a=txt(e.n,{x:xf+EW/2,y:EY+EW+54,'font-size':20,'font-weight':600,'text-anchor':'middle',opacity:0},g5);
  return {g,a,xf};
});

/* ================= RENDER ================= */
function render(t){
  /* ---- ato 1 ---- */
  const A1=ATOS[0], v1=janela(t,A1.a,A1.b,.4,.4);
  g1.setAttribute('opacity',v1.toFixed(3));
  q1a.setAttribute('opacity',eOut(p(t,A1.a+.1,A1.a+.7)));
  l1.forEach((r,i)=>r.setAttribute('width',(96*eOut(p(t,A1.a+.4+i*.13,A1.a+.9+i*.13))).toFixed(1)));
  trilhoA.setAttribute('x2',(lerp(cxA+L+40,cxB-40,eOut(p(t,A1.a+1.1,A1.a+2.0)))).toFixed(1));
  q1b.setAttribute('opacity',eOut(p(t,A1.a+1.5,A1.a+2.1)));
  const vb=p(t,A1.a+1.9,A1.a+3.4);
  bala.setAttribute('opacity', vb>0 && vb<1 ? 1 : 0);
  bala.setAttribute('x',(lerp(cxA+L+23,cxB+L/2-17,eInOut(vb))).toFixed(1));
  bala.setAttribute('y',(cy+L/2-17).toFixed(1));
  q1bM.setAttribute('opacity',eOut(p(t,A1.a+3.3,A1.a+3.9)).toFixed(3));

  /* ---- ato 2 ---- */
  const A2=ATOS[1], v2=janela(t,A2.a,A2.b,.4,.4);
  g2.setAttribute('opacity',v2.toFixed(3));
  espinha.setAttribute('y2',(lerp(190,566,eOut(p(t,A2.a+.1,A2.a+1.0)))).toFixed(1));
  msgN.forEach(m=>{
    const t0=A2.a+.6+m.q*3.6, pr=eOut4(p(t,t0,t0+.42));
    m.r.setAttribute('opacity',pr.toFixed(3));
    m.r.setAttribute('width',(m.w*pr).toFixed(1));
    if(m.lado<0) m.r.setAttribute('x',(800-32-m.w*pr).toFixed(1));
    m.a.setAttribute('opacity',(eOut(p(t,t0+.25,t0+.7))*.9).toFixed(3));
  });

  /* ---- ato 3 ---- */
  const A3=ATOS[2], v3=janela(t,A3.a,A3.b,.4,.4);
  g3.setAttribute('opacity',v3.toFixed(3));
  doc.setAttribute('opacity',eOut(p(t,A3.a+.1,A3.a+.8)));
  doc.setAttribute('height',(DH*eOut(p(t,A3.a+.1,A3.a+.9))).toFixed(1));
  docTit.setAttribute('width',(240*eOut(p(t,A3.a+.7,A3.a+1.2))).toFixed(1));
  docL.forEach((r,i)=>{
    const t0=A3.a+1.0+i*.19;
    r.setAttribute('width',((i%2?296:364)*eOut(p(t,t0,t0+.4))).toFixed(1));
  });
  selo.setAttribute('opacity',eOut4(p(t,A3.a+2.6,A3.a+3.0)));
  seloC.setAttribute('opacity',eOut(p(t,A3.a+2.95,A3.a+3.35)));

  /* ---- ato 4 ---- */
  const A4=ATOS[3], v4=janela(t,A4.a,A4.b,.4,.4);
  g4.setAttribute('opacity',v4.toFixed(3));
  colL.forEach((l,i)=>l.setAttribute('opacity',eOut(p(t,A4.a+.1+i*.035,A4.a+.5+i*.035))));
  barN.forEach((b,i)=>{
    const t0=A4.a+.7+i*.42;
    b.r.setAttribute('width',(b.w*eOut(p(t,t0,t0+.65))).toFixed(1));
    b.a.setAttribute('opacity',eOut(p(t,t0+.15,t0+.6)).toFixed(3));
  });
  baseL.setAttribute('x2',(lerp(GX,GX+GW,eOut(p(t,A4.a+2.4,A4.a+3.2)))).toFixed(1));
  marcos.forEach((m,i)=>{
    const t0=A4.a+2.8+i*.22, pr=eOut4(p(t,t0,t0+.4));
    m.setAttribute('opacity',pr.toFixed(3));
    m.setAttribute('y',(GY+333-30*(1-pr)).toFixed(1));
  });

  /* ---- ato 5 ---- */
  const A5=ATOS[4], v5=janela(t,A5.a,A5.b,.4,.4);
  g5.setAttribute('opacity',v5.toFixed(3));
  /* a malha entra, e sai no instante em que as peças começam a se separar */
  blocoM.setAttribute('opacity',(eOut(p(t,A5.a+.1,A5.a+.7))*(1-p(t,A5.a+1.1,A5.a+1.5))).toFixed(3));
  entN.forEach((e,i)=>{
    const t0=A5.a+1.1+i*.14, pr=eInOut(p(t,t0,t0+1.0));
    e.g.setAttribute('opacity',eOut(p(t,t0,t0+.35)).toFixed(3));
    e.g.setAttribute('transform','translate('+(lerp(0,e.xf-EX0,pr)).toFixed(1)+' 0)');
    e.a.setAttribute('opacity',eOut(p(t,t0+.55,t0+1.0)).toFixed(3));
  });
}

/* cada ato é medido quando já está montado e então centralizado no quadro */
const MEDIR=[4.6, 10.4, 15.6, 21.2, 26.0];
const CAIXA_W=1230, CAIXA_H=610, CX=800, CY=450;
[g1,g2,g3,g4,g5].forEach((g,i)=>{
  g.removeAttribute('transform');
  render(MEDIR[i]);
  const b=g.getBBox();
  const s=Math.min(1.55, CAIXA_W/b.width, CAIXA_H/b.height);
  g.setAttribute('transform',
    'translate('+(CX-(b.x+b.width/2)*s).toFixed(2)+' '+(CY-(b.y+b.height/2)*s).toFixed(2)+') scale('+s.toFixed(4)+')');
});

window.render=render; window.DUR=FIM; window.DUR_REAL=20; window.ESCALA=FIM/20;
render(0);
</script></body></html>
